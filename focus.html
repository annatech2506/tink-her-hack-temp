<!DOCTYPE html>
<html>
<head>
    <title> Focus System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #1f1c2c);
    background-size: 400% 400%;
    animation: gradientMove 12s ease infinite;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

@keyframes gradientMove {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

.container {
    width: 420px;
    padding: 35px;
    border-radius: 25px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    text-align: center;
}

h1 {
    font-size: 26px;
    margin-bottom: 20px;
}

select, button, textarea {
    width: 100%;
    padding: 12px;
    margin-top: 15px;
    border-radius: 12px;
    border: none;
    font-size: 16px;
}

select, textarea {
    background: rgba(255,255,255,0.1);
    color: white;
}

button {
    background: linear-gradient(90deg,#ff6a00,#ee0979);
    color: white;
    cursor: pointer;
    transition: 0.3s ease;
}

button:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(255,0,150,0.6);
}

.timer-wrapper {
    position: relative;
    width: 200px;
    height: 200px;
    margin: 20px auto;
}

svg { transform: rotate(-90deg); }

circle {
    fill: none;
    stroke-width: 10;
    stroke-linecap: round;
}

.bg { stroke: rgba(255,255,255,0.2); }

.progress {
    stroke: #ff6a00;
    stroke-dasharray: 565;
    stroke-dashoffset: 565;
    transition: stroke-dashoffset 1s linear;
}

#timeText {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 30px;
}

.hidden { display: none; }

.stars {
    display: flex;
    justify-content: center;
    gap: 10px;
    font-size: 25px;
    cursor: pointer;
    margin-top: 10px;
}

.star { color: gray; transition: 0.2s; }
.star.active { color: gold; }

textarea {
    resize: none;
    height: 80px;
}

.analytics {
    margin-top: 15px;
    font-size: 13px;
    opacity: 0.85;
}

.ai-box {
    margin-top: 10px;
    font-size: 13px;
    background: rgba(255,255,255,0.1);
    padding: 10px;
    border-radius: 10px;
}

</style>
</head>

<body>

<div class="container">

<h1>AI Focus System</h1>

<div id="home">
    <select id="duration">
        <option value="1">1 Minutes</option>
        <option value="5">5 Minutes</option>
        <option value="10">10 Minutes</option>
        <option value="25">25 Minutes</option>
        <option value="45">45 Minutes</option>
    </select>
    <button onclick="startTimer()">Start Focus Session</button>
</div>

<div id="session" class="hidden">
    <div class="timer-wrapper">
        <svg width="200" height="200">
            <circle class="bg" cx="100" cy="100" r="90"></circle>
            <circle class="progress" cx="100" cy="100" r="90"></circle>
        </svg>
        <div id="timeText">00:00</div>
    </div>
    <button onclick="endEarly()">Stop Session</button>
</div>

<div id="reflection" class="hidden">
    <h3>How was your focus?</h3>
    <div class="stars">
        <span class="star" onclick="rate(1)">★</span>
        <span class="star" onclick="rate(2)">★</span>
        <span class="star" onclick="rate(3)">★</span>
        <span class="star" onclick="rate(4)">★</span>
        <span class="star" onclick="rate(5)">★</span>
    </div>
    <textarea id="note" placeholder="What distracted you?"></textarea>
    <button onclick="submitReflection()">Submit Reflection</button>
</div>

<div class="analytics">
    Sessions: <span id="sessions">0</span> |
    Minutes: <span id="minutes">0</span> |
    Streak: <span id="streak">0</span> |
    Focus Score: <span id="focusScore">0</span>
</div>

<div class="ai-box" id="aiInsight">
    AI Insight: Start building your focus streak.
</div>

</div>

<script>

let countdown;
let totalSeconds;
let maxSeconds;
let rating = 0;

const circle = document.querySelector(".progress");
const circumference = 2 * Math.PI * 90;
circle.style.strokeDasharray = circumference;

let reflections = JSON.parse(localStorage.getItem("reflections")) || [];
let sessions = parseInt(localStorage.getItem("sessions")) || 0;
let minutes = parseInt(localStorage.getItem("minutes")) || 0;
let streak = parseInt(localStorage.getItem("streak")) || 0;
let lastDate = localStorage.getItem("lastDate") || null;

updateUI();

function startTimer() {
    let duration = parseInt(document.getElementById("duration").value);
    totalSeconds = duration * 60;
    maxSeconds = totalSeconds;

    switchPage("session");
    updateDisplay();

    countdown = setInterval(() => {
        totalSeconds--;
        updateDisplay();
        updateCircle();

        if (totalSeconds <= 0) {
            clearInterval(countdown);
            sessionComplete(duration);
        }
    }, 1000);
}

function updateDisplay() {
    let m = Math.floor(totalSeconds / 60);
    let s = totalSeconds % 60;
    document.getElementById("timeText").innerText =
        String(m).padStart(2,'0') + ":" + String(s).padStart(2,'0');
}

function updateCircle() {
    let progress = totalSeconds / maxSeconds;
    circle.style.strokeDashoffset = circumference * (1 - progress);
}

function endEarly() {
    clearInterval(countdown);
    switchPage("reflection");
}

function sessionComplete(duration) {
    sessions++;
    minutes += duration;

    localStorage.setItem("sessions", sessions);
    localStorage.setItem("minutes", minutes);

    updateStreak();
    updateUI();
    switchPage("reflection");
}

function rate(num) {
    rating = num;
    document.querySelectorAll(".star").forEach((star, i) => {
        star.classList.toggle("active", i < num);
    });
}

function submitReflection() {
    let note = document.getElementById("note").value;

    reflections.push({
        rating: rating,
        note: note,
        duration: maxSeconds/60,
        date: new Date().toLocaleDateString()
    });

    localStorage.setItem("reflections", JSON.stringify(reflections));

    generateInsight();
    updateFocusScore();

    document.getElementById("note").value = "";
    rating = 0;
    document.querySelectorAll(".star").forEach(star => star.classList.remove("active"));

    switchPage("home");
}

function updateFocusScore() {
    if(reflections.length === 0) return;

    let avg = reflections.reduce((sum,r)=>sum+r.rating,0)/reflections.length;
    let score = (avg * sessions).toFixed(1);

    document.getElementById("focusScore").innerText = score;
}

function updateStreak() {
    let today = new Date().toLocaleDateString();
    let yesterday = new Date();
    yesterday.setDate(yesterday.getDate()-1);

    if(lastDate === yesterday.toLocaleDateString()) {
        streak++;
    } else if(lastDate !== today) {
        streak = 1;
    }

    lastDate = today;
    localStorage.setItem("streak", streak);
    localStorage.setItem("lastDate", today);
}

function generateInsight() {
    let low = reflections.filter(r=>r.rating<=2).length;
    let high = reflections.filter(r=>r.rating>=4).length;
    let insight = "";

    if(low >= 3) {
        insight = "AI Insight: Your focus drops often. Try 5–10 minute sessions.";
    } else if(high >= 3) {
        insight = "AI Insight: Strong momentum detected. Increase session duration.";
    } else {
        insight = "AI Insight: Consistency builds cognitive endurance.";
    }

    document.getElementById("aiInsight").innerText = insight;
}

function updateUI() {
    document.getElementById("sessions").innerText = sessions;
    document.getElementById("minutes").innerText = minutes;
    document.getElementById("streak").innerText = streak;
    updateFocusScore();
}

function switchPage(page) {
    document.getElementById("home").classList.add("hidden");
    document.getElementById("session").classList.add("hidden");
    document.getElementById("reflection").classList.add("hidden");
    document.getElementById(page).classList.remove("hidden");
}

</script>

</body>
</html>
